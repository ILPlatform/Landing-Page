name: Firebase Hosting Deploy

on:
  push:
    branches:
    - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.1'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false
      - name: Write Firebase service account key
        run: |
          if [ -z '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILPLATFORM }}' ]; then
            echo "::error::Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_ILPLATFORM"
            exit 1
          fi
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILPLATFORM }}' > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only hosting:production --project ilplatform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
